name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publish current version or increment update/bugfix
        required: true
        type: choice
        options:
          - current
          - update
          - bugfix
      release_notes:
        description: Changelog entries, one per line
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.AUTOMATION }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        name: Prepare release files
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          VERSION=$(node scripts/prepare-release.mjs "${{ inputs.release_type }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check that release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 1
          fi

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add package.json changelog.md docs/index.html docs/version.json docs/changelog.json linux-files/org.nitrobolt.NitroBolt.metainfo.xml
          if git diff --cached --quiet; then
            echo "Release files are already prepared for $VERSION."
          else
            git commit -m "chore: release $VERSION"
          fi
          git tag -a "$TAG" -m "NitroBolt Desktop $VERSION"
          git push origin HEAD:master "$TAG"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      production: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          FILES=(linux/*.deb linux/*.tar.gz linux/*.AppImage mac/*.dmg windows/*.exe windows/*.appx)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No files found to upload"
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NitroBolt Desktop $TAG" \
            --generate-notes
