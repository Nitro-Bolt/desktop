name: Build (Manual)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      production:
        description: Enable production behavior, including update checks
        type: boolean
        default: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Install strip-nondeterminism
        run: sudo apt-get install strip-nondeterminism
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch
        run: pnpm run fetch
      - name: Compile
        run: pnpm run webpack:prod
      - name: Package
        env:
          PRODUCTION: ${{ inputs.production }}
        run: |
          PRODUCTION_ARGUMENT=()
          if [[ "$PRODUCTION" == "true" ]]; then
            PRODUCTION_ARGUMENT+=(--production)
          fi
          node release-automation/build.mjs --debian --tarball --appimage --x64 --armv7l --arm64 "${PRODUCTION_ARGUMENT[@]}"
      - name: Print file tree
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        shell: bash
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          tarballs=(dist/*.tar.gz)
          appimages=(dist/*.AppImage)
          if [ ${#debs[@]} -ne 3 ] || [ ${#tarballs[@]} -ne 3 ] || [ ${#appimages[@]} -ne 3 ]; then
            echo "Expected 3 Debian packages, 3 tarballs, and 3 AppImages."
            echo "Found ${#debs[@]} Debian packages, ${#tarballs[@]} tarballs, and ${#appimages[@]} AppImages."
            exit 1
          fi
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch
        run: pnpm run fetch
      - name: Compile
        run: pnpm run webpack:prod
      - name: Package
        env:
          PRODUCTION: ${{ inputs.production }}
        run: |
          PRODUCTION_ARGUMENT=()
          if [[ "$PRODUCTION" == "true" ]]; then
            PRODUCTION_ARGUMENT+=(--production)
          fi
          # Need to run the universal builds as separate commands or it breaks when @electron/universal
          # diffs the ASARs and finds spurious differences. Not clear why.
          node release-automation/build.mjs --mac --universal "${PRODUCTION_ARGUMENT[@]}"
          node release-automation/build.mjs --mac-legacy-11 --universal "${PRODUCTION_ARGUMENT[@]}"
          node release-automation/build.mjs --mac-legacy-10.13-10.14 --mac-legacy-10.15 --x64 "${PRODUCTION_ARGUMENT[@]}"
      - name: Print file tree
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.dmg)
          if [ ${#files[@]} -ne 4 ]; then
            echo "Expected 4 macOS disk images, but found ${#files[@]}."
            exit 1
          fi
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    # GitHub's Windows runners have a C: drive and a D: drive.
    # C: is for the OS and has good read performance but awful write performance.
    # D: has much better faster write performance (>20x faster than C:)
    # We want to use the D: drive whenever we can. Trying to do "pnpm install" on the
    # C: drive has been observed to take over an hour!
    runs-on: windows-latest
    steps:
      # actions/checkout can only clone to paths in $GITHUB_WORKSPACE which is on the C: drive,
      # so we have to clone to C: then copy to D: after. This repository itself isn't huge so
      # this is plenty fast.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          path: repo
      - name: "Move repository to D: drive"
        run: |
          Copy-Item -Path repo -Destination D:\repo -Recurse
          Remove-Item -Path repo -Recurse -Force
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: D:\repo\package.json
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The repository being on D: means that node_modules IO will be fast, but pnpm still caches
      # packages in a folder on C: by default. We need to make sure pnpm uses the D: drive instead
      # otherwise we still get bottlenecked by C:.
      - name: "Configure pnpm to use D: drive"
        run: |
          pnpm config set store-dir D:\pnpm-store
          pnpm config set cache-dir D:\pnpm-cache
      - name: Install dependencies
        working-directory: D:\repo
        run: pnpm install --frozen-lockfile
      - name: Fetch
        working-directory: D:\repo
        run: pnpm run fetch
      - name: Compile
        working-directory: D:\repo
        run: pnpm run webpack:prod
      - name: Package
        working-directory: D:\repo
        env:
          PRODUCTION: ${{ inputs.production }}
        run: |
          $productionArgument = if ($env:PRODUCTION -eq 'true') { '--production' } else { $null }
          node release-automation/build.mjs --windows --x64 --ia32 --arm64 $productionArgument
          node release-automation/build.mjs --windows-portable --x64 $productionArgument
          node release-automation/build.mjs --windows-legacy --ia32 --x64 $productionArgument
      - name: Print file tree
        working-directory: D:\repo
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        working-directory: D:\repo
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = @(
            "dist\NitroBolt-Setup-$version-x64.exe"
            "dist\NitroBolt-Setup-$version-ia32.exe"
            "dist\NitroBolt-Setup-$version-arm64.exe"
            "dist\NitroBolt.Portable.$version.x64.exe"
            "dist\NitroBolt-Legacy-Setup-$version-x64.exe"
            "dist\NitroBolt-Legacy-Setup-$version-ia32.exe"
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Error "Missing expected Windows artifacts:`n$($missing -join "`n")"
            exit 1
          }
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            D:\repo\dist\*.exe
          if-no-files-found: error

  create-release:
    if: github.event_name == 'workflow_dispatch' && !inputs.production
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION-build-$(date +%s)"
          shopt -s nullglob
          FILES=(linux/*.deb linux/*.tar.gz linux/*.AppImage mac/*.dmg windows/*.exe)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release create "$TAG" "${FILES[@]}" \
              --title "Manual Build v$VERSION" \
              --notes "Manually triggered build from GitHub Actions." \
              --draft
            echo "Created draft release: $TAG"
          else
            echo "No files found to upload"
            exit 1
          fi
