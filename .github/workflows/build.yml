name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      production:
        description: Enable production behavior, including update checks
        type: boolean
        default: false
      version_suffix:
        description: Append a seven-character commit hash to the package version
        type: string
        default: ""
      update_channel:
        description: Update channel embedded in production builds
        type: string
        default: stable
      microsoft_store:
        description: Build Microsoft Store APPX packages
        type: boolean
        default: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Set build version
        if: inputs.version_suffix != ''
        run: node scripts/set-build-version.mjs "${{ inputs.version_suffix }}"
      - name: Install strip-nondeterminism
        run: sudo apt-get install strip-nondeterminism
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch
        run: pnpm run fetch
      - name: Compile
        run: pnpm run webpack:prod
      - name: Package
        env:
          PRODUCTION: ${{ inputs.production }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: |
          PRODUCTION_ARGUMENT=()
          if [[ "$PRODUCTION" == "true" ]]; then
            PRODUCTION_ARGUMENT+=(--production)
          fi
          PRODUCTION_ARGUMENT+=("--update-channel=$UPDATE_CHANNEL")
          node release-automation/build.mjs --debian --rpm --tarball --appimage --x64 --armv7l --arm64 "${PRODUCTION_ARGUMENT[@]}"
      - name: Print file tree
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED=(
            "dist/NitroBolt-Linux-Installer-x86_64-$VERSION.deb"
            "dist/NitroBolt-Linux-Installer-arm64-$VERSION.deb"
            "dist/NitroBolt-Linux-Installer-armv7l-$VERSION.deb"
            "dist/NitroBolt-Linux-Installer-x86_64-$VERSION.rpm"
            "dist/NitroBolt-Linux-Installer-arm64-$VERSION.rpm"
            "dist/NitroBolt-Linux-Installer-armv7l-$VERSION.rpm"
            "dist/NitroBolt-Linux-Portable-x86_64-$VERSION.AppImage"
            "dist/NitroBolt-Linux-Portable-arm64-$VERSION.AppImage"
            "dist/NitroBolt-Linux-Portable-armv7l-$VERSION.AppImage"
            "dist/NitroBolt-Linux-Portable-x86_64-$VERSION.tar.gz"
            "dist/NitroBolt-Linux-Portable-arm64-$VERSION.tar.gz"
            "dist/NitroBolt-Linux-Portable-armv7l-$VERSION.tar.gz"
          )
          for FILE in "${EXPECTED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "Missing expected Linux artifact: $FILE"
              exit 1
            fi
          done
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Set build version
        if: inputs.version_suffix != ''
        run: node scripts/set-build-version.mjs "${{ inputs.version_suffix }}"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch
        run: pnpm run fetch
      - name: Compile
        run: pnpm run webpack:prod
      - name: Package
        env:
          PRODUCTION: ${{ inputs.production }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: |
          PRODUCTION_ARGUMENT=()
          if [[ "$PRODUCTION" == "true" ]]; then
            PRODUCTION_ARGUMENT+=(--production)
          fi
          PRODUCTION_ARGUMENT+=("--update-channel=$UPDATE_CHANNEL")
          # Need to run the universal builds as separate commands or it breaks when @electron/universal
          # diffs the ASARs and finds spurious differences. Not clear why.
          node release-automation/build.mjs --mac --universal "${PRODUCTION_ARGUMENT[@]}"
          node release-automation/build.mjs --mac-legacy-11 --universal "${PRODUCTION_ARGUMENT[@]}"
          node release-automation/build.mjs --mac-legacy-10.13-10.14 --mac-legacy-10.15 --x64 "${PRODUCTION_ARGUMENT[@]}"
      - name: Print file tree
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED=(
            "dist/NitroBolt-MacOS-universal-$VERSION.dmg"
            "dist/NitroBolt-MacOSLegacy-11-universal-$VERSION.dmg"
            "dist/NitroBolt-MacOSLegacy-10.15-x86_64-$VERSION.dmg"
            "dist/NitroBolt-MacOSLegacy-10.13-10.14-x86_64-$VERSION.dmg"
          )
          for FILE in "${EXPECTED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "Missing expected macOS artifact: $FILE"
              exit 1
            fi
          done
      - name: Verify macOS application signatures
        shell: bash
        run: |
          for DMG in dist/*.dmg; do
            MOUNT_POINT=$(mktemp -d)
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
            codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/NitroBolt.app"
            hdiutil detach "$MOUNT_POINT"
            rmdir "$MOUNT_POINT"
          done
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    # GitHub's Windows runners have a C: drive and a D: drive.
    # C: is for the OS and has good read performance but awful write performance.
    # D: has much better faster write performance (>20x faster than C:)
    # We want to use the D: drive whenever we can. Trying to do "pnpm install" on the
    # C: drive has been observed to take over an hour!
    runs-on: windows-latest
    steps:
      # actions/checkout can only clone to paths in $GITHUB_WORKSPACE which is on the C: drive,
      # so we have to clone to C: then copy to D: after. This repository itself isn't huge so
      # this is plenty fast.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          path: repo
      - name: "Move repository to D: drive"
        run: |
          Copy-Item -Path repo -Destination D:\repo -Recurse
          Remove-Item -Path repo -Recurse -Force
      - name: Set build version
        if: inputs.version_suffix != ''
        working-directory: D:\repo
        run: node scripts/set-build-version.mjs "${{ inputs.version_suffix }}"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The repository being on D: means that node_modules IO will be fast, but pnpm still caches
      # packages in a folder on C: by default. We need to make sure pnpm uses the D: drive instead
      # otherwise we still get bottlenecked by C:.
      - name: "Configure pnpm to use D: drive"
        run: |
          pnpm config set store-dir D:\pnpm-store
          pnpm config set cache-dir D:\pnpm-cache
      - name: Install dependencies
        working-directory: D:\repo
        run: pnpm install --frozen-lockfile
      - name: Fetch
        working-directory: D:\repo
        run: pnpm run fetch
      - name: Compile
        working-directory: D:\repo
        run: pnpm run webpack:prod
      - name: Package
        working-directory: D:\repo
        env:
          PRODUCTION: ${{ inputs.production }}
          UPDATE_CHANNEL: ${{ inputs.update_channel }}
          MICROSOFT_STORE: ${{ inputs.microsoft_store }}
        run: |
          $productionArgument = if ($env:PRODUCTION -eq 'true') { '--production' } else { $null }
          $updateChannelArgument = "--update-channel=$env:UPDATE_CHANNEL"
          $storeArgument = if ($env:MICROSOFT_STORE -eq 'true') { '--microsoft-store' } else { $null }
          node release-automation/build.mjs --windows $storeArgument --x64 --ia32 --arm64 $productionArgument $updateChannelArgument
          node release-automation/build.mjs --windows-portable --x64 $productionArgument $updateChannelArgument
          node release-automation/build.mjs --windows-legacy --ia32 --x64 $productionArgument $updateChannelArgument
      - name: Print file tree
        working-directory: D:\repo
        run: node scripts/print-file-tree.mjs dist
      - name: Verify artifacts
        working-directory: D:\repo
        shell: pwsh
        env:
          MICROSOFT_STORE: ${{ inputs.microsoft_store }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = @(
            "dist\NitroBolt-Windows-Installer-x86_64-$version.exe"
            "dist\NitroBolt-Windows-Installer-x86_32-$version.exe"
            "dist\NitroBolt-Windows-Installer-arm64-$version.exe"
            "dist\NitroBolt-Windows-Portable-x86_64-$version.exe"
            "dist\NitroBolt-WindowsLegacy-Installer-x86_64-$version.exe"
            "dist\NitroBolt-WindowsLegacy-Installer-x86_32-$version.exe"
          )
          if ($env:MICROSOFT_STORE -eq 'true') {
            $expected += @(
              "dist\NitroBolt-Windows-Store-x86_64-$version.appx"
              "dist\NitroBolt-Windows-Store-x86_32-$version.appx"
              "dist\NitroBolt-Windows-Store-arm64-$version.appx"
            )
          }
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Error "Missing expected Windows artifacts:`n$($missing -join "`n")"
            exit 1
          }
      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            D:\repo\dist\*.exe
            D:\repo\dist\*.appx
          if-no-files-found: error
